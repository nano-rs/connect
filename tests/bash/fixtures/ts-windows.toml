# nano Windows endpoint agent — generated by @nano-rs/connect on fixture
# Collects Windows Event Log (including Sysmon) natively and ships to https://nano.test/ingest/
# over HTTPS with the ingest token.
# Install with install-agent.ps1 (Run as Administrator).

data_dir = "C:/ProgramData/Vector/data"

# Note: some Vector builds have a windows_event_log freeze-after-idle bug (vectordotdev/vector
# #25194). The service is configured with automatic restart-on-failure as a safety net.
[sources.windows_events]
type = "windows_event_log"
channels = ["Application", "System", "Security", "Microsoft-Windows-Sysmon/Operational", "Microsoft-Windows-PowerShell/Operational", "Microsoft-Windows-Windows Defender/Operational"]
read_existing_events = false

[transforms.tag]
type = "remap"
inputs = ["windows_events"]
source = '''
# Sysmon gets its own source_type; everything else is windows_event.
channel = downcase(to_string(.channel) ?? "")
source_type = "windows_event"
if contains(channel, "sysmon") {
    source_type = "windows_sysmon"
}
host = get_hostname!()
event_json = encode_json(.)
. = {}
.message = event_json
.source_type = source_type
.src_host = host
'''

[transforms.out_route]
type = "route"
inputs = ["tag"]

[transforms.out_route.route]
windows_event = '.source_type == "windows_event"'
windows_sysmon = '.source_type == "windows_sysmon"'

[sinks.nano_windows_event]
type = "http"
inputs = ["out_route.windows_event"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
# is on the wire becomes .message verbatim; a JSON envelope therefore lands as .message and every
# parser that regexes a raw log line fails. One line per event, source_type via the header below.
[sinks.nano_windows_event.encoding]
codec = "text"

[sinks.nano_windows_event.framing]
method = "newline_delimited"

[sinks.nano_windows_event.auth]
strategy = "bearer"
token = "${VECTOR_AUTH_TOKEN}"

# nano routes on X-Source-Type — NOT on any source_type field in the body. Content-Type must say
# text/plain so nano treats the body as a raw log line rather than trying to unwrap it as JSON.
[sinks.nano_windows_event.request.headers]
X-Source-Type = "windows_event"
Content-Type = "text/plain"

[sinks.nano_windows_event.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

[sinks.nano_windows_sysmon]
type = "http"
inputs = ["out_route.windows_sysmon"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
# is on the wire becomes .message verbatim; a JSON envelope therefore lands as .message and every
# parser that regexes a raw log line fails. One line per event, source_type via the header below.
[sinks.nano_windows_sysmon.encoding]
codec = "text"

[sinks.nano_windows_sysmon.framing]
method = "newline_delimited"

[sinks.nano_windows_sysmon.auth]
strategy = "bearer"
token = "${VECTOR_AUTH_TOKEN}"

# nano routes on X-Source-Type — NOT on any source_type field in the body. Content-Type must say
# text/plain so nano treats the body as a raw log line rather than trying to unwrap it as JSON.
[sinks.nano_windows_sysmon.request.headers]
X-Source-Type = "windows_sysmon"
Content-Type = "text/plain"

[sinks.nano_windows_sysmon.buffer]
type = "disk"
max_size = 268435488
when_full = "block"
