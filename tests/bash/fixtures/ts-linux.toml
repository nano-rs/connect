# nano Linux endpoint agent — generated by @nano-rs/connect on fixture
# Collects journald / log files and ships to https://nano.test/ingest/ over HTTPS.

data_dir = "/var/lib/vector"

[sources.journald]
type = "journald"

[transforms.journald_tag]
type = "remap"
inputs = ["journald"]
source = '''
# Sysmon for Linux logs to journald under identifier/unit "sysmon". Tag those linux_sysmon (its
# own parser, like Windows Sysmon); everything else is linux_journald. Works automatically if
# sysmonforlinux is installed — no toggle needed.
ident = downcase(string(.SYSLOG_IDENTIFIER) ?? "")
unit = downcase(string(._SYSTEMD_UNIT) ?? "")
source_type = "linux_journald"
if contains(ident, "sysmon") || contains(unit, "sysmon") {
    source_type = "linux_sysmon"
}
.source_type = source_type
.src_host = get_hostname!()
'''

# Forward every tagged source to the target.
[transforms.out_route]
type = "route"
inputs = ["journald_tag"]

[transforms.out_route.route]
linux_journald = '.source_type == "linux_journald"'
linux_sysmon = '.source_type == "linux_sysmon"'

[sinks.nano_linux_journald]
type = "http"
inputs = ["out_route.linux_journald"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
# is on the wire becomes .message verbatim; a JSON envelope therefore lands as .message and every
# parser that regexes a raw log line fails. One line per event, source_type via the header below.
[sinks.nano_linux_journald.encoding]
codec = "text"

[sinks.nano_linux_journald.framing]
method = "newline_delimited"

[sinks.nano_linux_journald.auth]
strategy = "bearer"
token = "${VECTOR_AUTH_TOKEN}"

# nano routes on X-Source-Type — NOT on any source_type field in the body. Content-Type must say
# text/plain so nano treats the body as a raw log line rather than trying to unwrap it as JSON.
[sinks.nano_linux_journald.request.headers]
X-Source-Type = "linux_journald"
Content-Type = "text/plain"

[sinks.nano_linux_journald.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

[sinks.nano_linux_sysmon]
type = "http"
inputs = ["out_route.linux_sysmon"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
# is on the wire becomes .message verbatim; a JSON envelope therefore lands as .message and every
# parser that regexes a raw log line fails. One line per event, source_type via the header below.
[sinks.nano_linux_sysmon.encoding]
codec = "text"

[sinks.nano_linux_sysmon.framing]
method = "newline_delimited"

[sinks.nano_linux_sysmon.auth]
strategy = "bearer"
token = "${VECTOR_AUTH_TOKEN}"

# nano routes on X-Source-Type — NOT on any source_type field in the body. Content-Type must say
# text/plain so nano treats the body as a raw log line rather than trying to unwrap it as JSON.
[sinks.nano_linux_sysmon.request.headers]
X-Source-Type = "linux_sysmon"
Content-Type = "text/plain"

[sinks.nano_linux_sysmon.buffer]
type = "disk"
max_size = 268435488
when_full = "block"
