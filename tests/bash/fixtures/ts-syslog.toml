# =============================================================================
# Sink: forward everything tagged above to nano — https://nano.test/ingest/ (HTTPS).
# Acks are off because syslog (UDP) can't honor them; the disk buffer provides durability
# across restarts.
# =============================================================================
[sinks.nano_cisco_asa]
type = "http"
inputs = ["cisco_asa_tag"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
# is on the wire becomes .message verbatim; a JSON envelope therefore lands as .message and every
# parser that regexes a raw log line fails. One line per event, source_type via the header below.
[sinks.nano_cisco_asa.encoding]
codec = "text"

[sinks.nano_cisco_asa.framing]
method = "newline_delimited"

[sinks.nano_cisco_asa.auth]
strategy = "bearer"
token = "${VECTOR_AUTH_TOKEN}"

# nano routes on X-Source-Type — NOT on any source_type field in the body. Content-Type must say
# text/plain so nano treats the body as a raw log line rather than trying to unwrap it as JSON.
[sinks.nano_cisco_asa.request.headers]
X-Source-Type = "cisco_asa"
Content-Type = "text/plain"

[sinks.nano_cisco_asa.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

# =============================================================================
# Local metrics (http://localhost:9598/metrics) — handy to confirm events flow
# =============================================================================
[sources.internal_metrics]
type = "internal_metrics"

[sinks.metrics]
type = "prometheus_exporter"
inputs = ["internal_metrics"]
address = "0.0.0.0:9598"
