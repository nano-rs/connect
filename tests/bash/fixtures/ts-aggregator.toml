# =============================================================================
# Forward agents + syslog to nano. "agents" is already tagged.
# HTTP transport: one sink per source_type (nano routes on a static per-sink header).
# Acks off because syslog (UDP) can't honor them.
# =============================================================================
# The HTTP uplink needs one sink per source_type, so split the agent stream by tag.
# An agent source_type NOT listed here lands in "_unmatched", which nothing consumes — Vector
# drops it. That is deliberate: dropping is visible in metrics, whereas routing it to a sink with
# the wrong X-Source-Type header would silently mislabel your data. Add a route + matching sink
# below for any custom source_type you introduce (e.g. a --files group on a Linux agent).
[transforms.agent_route]
type = "route"
inputs = ["agents"]

[transforms.agent_route.route]
windows_event = '.source_type == "windows_event"'
windows_sysmon = '.source_type == "windows_sysmon"'
linux_journald = '.source_type == "linux_journald"'
linux_sysmon = '.source_type == "linux_sysmon"'

[sinks.nano_windows_event]
type = "http"
inputs = ["agent_route.windows_event"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
# is on the wire becomes .message verbatim; a JSON envelope therefore lands as .message and every
# parser that regexes a raw log line fails. One line per event, source_type via the header below.
[sinks.nano_windows_event.encoding]
codec = "text"

[sinks.nano_windows_event.framing]
method = "newline_delimited"

[sinks.nano_windows_event.auth]
strategy = "bearer"
token = "${VECTOR_AUTH_TOKEN}"

# nano routes on X-Source-Type — NOT on any source_type field in the body. Content-Type must say
# text/plain so nano treats the body as a raw log line rather than trying to unwrap it as JSON.
[sinks.nano_windows_event.request.headers]
X-Source-Type = "windows_event"
Content-Type = "text/plain"

[sinks.nano_windows_event.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

[sinks.nano_windows_sysmon]
type = "http"
inputs = ["agent_route.windows_sysmon"]
uri = "https://nano.test/ingest/"
method = "post"

# codec = "text" sends the .message field as a raw line — NOT "json", which would send the whole
# Vector event as a JSON object. nano's HTTP ingest decodes the request body as bytes, so whatever
