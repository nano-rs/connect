# nano aggregator — generated by @nano-rs/connect on fixture
#
# Receives endpoint agents (Vector-native) and optionally syslog from network devices, then
# forwards everything to nano — https://nano.test/ingest/ (HTTPS). Point your Windows/Linux agents
# at this host:9000; point syslog devices at the per-device ports below.

data_dir = "/var/lib/vector"

# =============================================================================
# Endpoint agents ship here (already tagged with their source_type)
# =============================================================================
[sources.agents]
type = "vector"
address = "0.0.0.0:9000"

# =============================================================================
# Syslog from network devices (enabled below; uncomment more as needed)
# =============================================================================
# --- Cisco ASA / FTD firewall (udp :5514) ---
[sources.cisco_asa]
# A raw socket, NOT Vector's `syslog` source, on purpose. nano's parsers are written against the
# syslog WIRE format: cisco_asa matches "<ts> <host> %ASA-<sev>-<id>: ..." and strips the <PRI>
# itself. Vector's syslog source pre-parses that envelope and hands on only the message body, so
# the "%ASA-…" tag the parser keys on is gone before it ever arrives and every event lands with
# "Could not parse ASA message ID pattern". Reading raw bytes keeps the line intact.
type = "socket"
mode = "udp"
address = "0.0.0.0:5514"

[sources.cisco_asa.decoding]
codec = "bytes"

[transforms.cisco_asa_tag]
type = "remap"
inputs = ["cisco_asa"]
source = '''
# Stamp nano's source_type; .message stays exactly as it arrived on the wire.
.source_type = "cisco_asa"
.src_host = to_string(.host) ?? ""
'''

